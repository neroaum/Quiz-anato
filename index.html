<style>
/* Layout: columna única tipo visor de imágenes; panel de imagen arriba, preguntas debajo */
:root{--bg:#f3f5f6;--panel:#fff;--fg:#14202a;--mut:#5b6b78;--line:#d5dce1;--acc:#0b6e8a;--accfg:#fff;--ok:#1b7f4b;--okbg:#e2f3ea;--bad:#b3261e;--badbg:#fbe7e5;--img:#0c1114;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--panel:#172027;--fg:#e6edf1;--mut:#94a5b1;--line:#2a3943;--acc:#4cc3e0;--accfg:#06222b;--ok:#5fd18f;--okbg:#14301f;--bad:#ff8a80;--badbg:#38191a;--img:#05080a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1519;--panel:#172027;--fg:#e6edf1;--mut:#94a5b1;--line:#2a3943;--acc:#4cc3e0;--accfg:#06222b;--ok:#5fd18f;--okbg:#14301f;--bad:#ff8a80;--badbg:#38191a;--img:#05080a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:calc(15px*var(--fz,1))/1.5 var(--sans);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:calc(22px*var(--fz,1));margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:calc(13px*var(--fz,1));color:var(--mut)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
.view{background:var(--img);border-radius:6px;min-height:160px;display:flex;align-items:center;justify-content:center;color:#8fa1ad;position:relative;overflow:hidden}
.view{flex-wrap:wrap;gap:2px}.pic{position:relative;line-height:0;max-width:100%;min-width:0}.pic img{display:block;max-width:100%;max-height:440px;height:auto;width:auto}.view.pick .pic{cursor:crosshair}.dot{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid;pointer-events:none}.dot.mark{border-color:#ffd54a;background:#ffd54a33}.dot.good{border-color:#3ddc84;background:#3ddc8440}.dot.you{border-color:#ff5252;background:#ff525240}.dot.you.hit{border-color:#3ddc84;background:#3ddc8440}
.view .ph{padding:18px;text-align:center;font-size:calc(13px*var(--fz,1))}
.view label{color:#4cc3e0;text-decoration:underline;cursor:pointer}
.view .tag{position:absolute;left:8px;top:8px;font:500 12px var(--mono);color:#cfe9f1;background:#0008;padding:2px 8px;border-radius:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:calc(16px*var(--fz,1));margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
button,.opt{font:inherit}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.miss{border-style:dashed;border-color:var(--ok)}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fb{font-size:calc(14px*var(--fz,1));color:var(--mut)}.fb b{color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.big{font-size:calc(44px*var(--fz,1));font-weight:600;font-family:var(--mono)}
ul.miss{margin:0;padding-left:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:6px;display:flex;gap:6px;align-items:center}
.nav .btn{padding:8px 12px}.nav select{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.chip{display:inline-block;width:1.4em;height:1.1em;border-radius:3px;border:1px solid #888;vertical-align:-2px;margin-left:4px}.inp{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:calc(14px*var(--fz,1))}.prow .bar{height:8px}
.small{font-size:calc(13px*var(--fz,1));color:var(--mut)}
.nav .mono{white-space:nowrap}
.view.two{gap:2px}.view.two .pic{flex:1;min-width:0}.star{background:none;border:0;font-size:calc(20px*var(--fz,1));cursor:pointer;color:var(--acc);padding:0 4px}
.at .opt{flex-direction:column;align-items:flex-start;gap:2px}.at .opt b{font-weight:600}
.chipn{display:inline-block;min-width:1.5em;text-align:center;background:var(--acc);color:var(--accfg);border-radius:10px;font:600 12px var(--mono);margin-right:6px}
.dot.num{width:18px;height:18px;font:600 11px/18px var(--mono);color:#000;text-align:center;border-radius:50%;background:#ffd60a;border:1px solid #000;margin:-9px 0 0 -9px}
textarea.inp{height:90px;font:12px var(--mono)}.dot.tp{pointer-events:auto;cursor:pointer;width:34px;height:34px;border:0;background:transparent;margin:0;padding:0}.dot.tp.sel{border:3px solid #ffd60a;background:#ffd60a33}.rgn{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}.hmg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}.hm{display:block;width:14px;height:14px;border-radius:3px;background:#8884}.hm.l1{background:#0f766e55}.hm.l2{background:#0f766eaa}.hm.l3{background:#0f766e}.ring{position:absolute;width:38px;height:38px;border:3px solid #ffd60a;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #000a;pointer-events:none}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f766e;color:#fff;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 4px 14px #0006;max-width:90vw;text-align:center}html[data-hand] .btn,html[data-hand] .opt{min-height:50px;font-size:calc(17px*var(--fz,1))}html[data-hand] #nx,html[data-hand] #nq,html[data-hand] #nl,html[data-hand] #vn,html[data-hand] #pn,html[data-hand] #lnx,html[data-hand] #cn{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0005;z-index:5}details.mn>summary{cursor:pointer;font-weight:600;padding:6px 0}</style>
